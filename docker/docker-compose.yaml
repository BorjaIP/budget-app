volumes:
  gluetun:
  ollama:

networks:
  budget-net:

services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    privileged: true
    cap_add:
      - NET_ADMIN
    ports:
      - 11434:11434
    volumes:
      - gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_REGIONS=france,switzerland,de_berlin
    networks:
      - budget-net

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # Used in VPN
    # ports:
      # - 11434:11434
    environment:
      - OLLAMA_HOST=0.0.0.0
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama:/root/.ollama
    network_mode: "service:gluetun"
    # networks:
      # - budget-net
    tty: true
    deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                capabilities: [gpu]
                count: all

  # One-shot: pulls the categorization model once, then exits. Does not block
  # `app` from starting — the model may not be ready yet on first launch, and
  # the app is expected to tolerate that (LLM calls fail gracefully until the
  # model finishes pulling).
  model-pull:
    image: docker.io/ollama/ollama:latest
    container_name: model-pull
    depends_on:
      - gluetun
      - ollama
    networks:
      - budget-net
    environment:
      - OLLAMA_HOST=gluetun:11434
    entrypoint: ["sh", "-c", "ollama pull qwen2.5:3b-instruct"]
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: budget-app
    restart: unless-stopped
    depends_on:
      - gluetun
      - ollama
    networks:
      - budget-net
    environment:
      - OLLAMA_BASE_URL=http://gluetun:11434
    ports:
      - "3000:3000"
      - "8000:8000"