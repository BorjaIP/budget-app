[project]
name = "budget-app"
version = "0.1.0"
description = 'Personal app for budget management'
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [{ name = "BorjaIP"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "reflex<=0.10.0",
  "sqlmodel<=0.0.48",
  "sqlalchemy[asyncio]<=2.1.4",
  "pandas<=3.0.6",
  "openpyxl<=3.1.5",
  "pydantic<=2.14.0",
  "xlrd<=2.0.2",
  "httpx<=0.28.1",
  "pydantic-settings<=2.9.2",
  "psycopg2-binary<=2.9.10",
]

[project.urls]
Documentation = "https://github.com/BorjaIP/budget-app#readme"
Issues = "https://github.com/BorjaIP/budget-app/issues"
Source = "https://github.com/BorjaIP/budget-app"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest<=9.1.1",
]
